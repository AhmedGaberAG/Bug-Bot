amcl:
  ros__parameters:
    # ROS 2 Interface / TF
    use_sim_time: true
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "scan"
    tf_broadcast: true
    transform_tolerance: 1.0

    # Odometry Motion Model
    # Differential-drive robot
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.05

    # Laser Sensor Model
    # Likelihood Field Model
    laser_model_type: "likelihood_field"
    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1

    # Particle Filter / Resampling
    min_particles: 500
    max_particles: 2000
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # Recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Beam Skipping
    # Disabled initially
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # AMCL Update Thresholds
    update_min_d: 0.25
    update_min_a: 0.20

    # Initial Pose
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # Pose Persistence
    save_pose_rate: 0.5
    do_beamskip: false
    first_map_only: false