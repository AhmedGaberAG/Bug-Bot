
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry from diff_drive_controller
    odom0: /bugbot_controller/odom

    # X, Y, Z,
    # roll, pitch, yaw,
    # vx, vy, vz, 
    # vroll, vpitch, vyaw,
    # ax, ay, az
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU topic
    imu0: /imu/out

    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10

    use_control: false
    print_diagnostics: true
